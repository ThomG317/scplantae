name: Changelog

on:
  push:
    branches: ['release/**']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  changelog:
    name: Update release changelog
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout validated commit with full history and tags
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # The script uses only Node.js and Git, so npm install is unnecessary here.
      - name: Generate changelog
        run: npm run changelog

      - name: Commit and push changelog if changed
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "Changelog is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- CHANGELOG.md
          git commit -m ":memo: Update changelog"
          # Never force-push: if the branch moved meanwhile, preserve the newer commits.
          git push origin "HEAD:refs/heads/$RELEASE_BRANCH"
