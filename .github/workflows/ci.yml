name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy (branch, tag or commit)
        required: true
        type: string

permissions:
  contents: read

jobs:
  checks:
    name: Validate and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run type-check
        run: npm run type-check

      - name: Run tests
        run: npm run test -- --passWithNoTests

      - name: Run production build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Upload GitHub Pages artifact
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  changelog:
    name: Update release changelog
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/') }}
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout validated commit with full history and tags
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # The script uses only Node.js and Git, so npm install is unnecessary here.
      - name: Generate changelog
        run: npm run changelog

      - name: Commit and push changelog if changed
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "Changelog is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- CHANGELOG.md
          git commit -m ":memo: Update changelog"
          # Never force-push: if the branch moved meanwhile, preserve the newer commits.
          git push origin "HEAD:refs/heads/$RELEASE_BRANCH"

  deploy:
    name: Deploy to GitHub Pages
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    needs: checks
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
